name: Buscar teléfonos nuevos

# Cada día busca lanzamientos nuevos (Wikidata) y, si hay cambios, los guarda y vuelve a publicar la web.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  novedades:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar lanzamientos
        run: node scripts/fetch-phones.mjs
      - name: Guardar si hay cambios
        run: |
          if [ -n "$(git status --porcelain data/novedades.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/novedades.json
            git commit -m "Teléfonos nuevos: actualización automática"
            git push
          fi
